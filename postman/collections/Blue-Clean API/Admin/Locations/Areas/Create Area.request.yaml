$kind: http-request
url: "{{base_url}}/admin/locations/areas"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "city_id": 1,
        "name_ar": "النرجس",
        "name_en": "Al Narjis",
        "is_active": true
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 2000
