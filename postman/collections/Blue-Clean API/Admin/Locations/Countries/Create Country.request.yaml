$kind: http-request
url: "{{base_url}}/admin/locations/countries"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "name_ar": "دولة الكويت",
        "name_en": "Kuwait",
        "code": "+965",
        "is_active": true
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 2000
