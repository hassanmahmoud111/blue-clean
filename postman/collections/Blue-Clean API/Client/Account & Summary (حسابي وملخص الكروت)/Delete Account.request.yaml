$kind: http-request
url: "{{base_url}}/client/account"
method: DELETE
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "password": "password",
      "reason": "No longer using the platform"
    }
auth:
  type: bearer
  credentials:
    token: "{{client_token}}"
order: 2000
