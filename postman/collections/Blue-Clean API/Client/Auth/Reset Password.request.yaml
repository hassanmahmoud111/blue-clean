$kind: http-request
url: "{{base_url}}/client/auth/reset-password"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "email": "client@example.com",
        "otp": "1111",
        "password": "newpassword123",
        "password_confirmation": "newpassword123"
    }
auth:
  type: noauth
order: 5000
