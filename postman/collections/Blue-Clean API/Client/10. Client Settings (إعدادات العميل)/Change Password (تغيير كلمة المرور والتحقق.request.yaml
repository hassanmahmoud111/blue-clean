$kind: http-request
name: Change Password (تغيير كلمة المرور والتحقق من القديمة)
url: "{{base_url}}/client/settings/change-password"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "current_password": "password123",
        "password": "newpassword123",
        "password_confirmation": "newpassword123"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 4000
