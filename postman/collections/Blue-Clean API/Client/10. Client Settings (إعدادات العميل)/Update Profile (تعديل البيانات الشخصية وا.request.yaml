$kind: http-request
name: Update Profile (تعديل البيانات الشخصية والصورة)
url: "{{base_url}}/client/settings/profile"
method: POST
headers:
  Accept: application/json
body:
  type: formdata
  content:
    - type: text
      key: name
      value: محمد القحطاني
    - type: text
      key: facility_name
      value: مؤسسة السكن المميز
    - type: text
      key: job_title
      value: مدير الحساب
    - type: text
      key: email
      value: m.alqahtani@example.com
    - type: text
      key: phone
      value: "+966501234567"
    - type: file
      key: avatar
      src:
        - ""
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 2000
