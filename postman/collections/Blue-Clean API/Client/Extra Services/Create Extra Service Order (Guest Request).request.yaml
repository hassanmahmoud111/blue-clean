$kind: http-request
url: "{{base_url}}/client/extra-services"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "order_source_type": "guest_request",
        "booking_id": 1,
        "service_type": "غسيل كنب",
        "quantity": 1,
        "estimated_cost": 150.00,
        "instructions": "تنظيف وتعقيم طقم الكنب في الصالة بالبخار",
        "add_cost_to_booking": true,
        "send_confirmation_to_guest": true,
        "require_manager_approval": false,
        "execution_date": "2026-09-10",
        "start_time": "11:00 AM",
        "end_time": "01:00 PM",
        "priority": "normal",
        "assignment_method": "auto",
        "notify_worker": true,
        "notify_supervisor": true,
        "notify_guest": true,
        "internal_notes": "تم التنسيق مع الضيف"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 4000
