$kind: http-request
url: "{{base_url}}/client/extra-services/1"
method: PUT
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "quantity": 2,
        "estimated_cost": 300.00
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 8000
